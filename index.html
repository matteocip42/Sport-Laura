<style>
/* Layout: app shell — barre d'onglets en verre (téléphone) / colonne en verre (ordinateur), posée sur un champ de lumière rose qui bouge lentement. Chiffres en grand, titres ronds. */
:root{
  color-scheme: light;
  --bg:#fdecf2;
  --blob-1:#ff9cc2; --blob-2:#ffc4a6; --blob-3:#e2b4ff; --blob-4:#ffd0e0;
  --glass:rgba(255,255,255,.46); --glass-2:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.85); --glass-hi:rgba(255,255,255,.98);
  --shadow:0 10px 34px rgba(160,40,95,.14);
  --fg:#3a0f25; --fg-2:rgba(58,15,37,.72); --fg-3:rgba(58,15,37,.5); --line:rgba(58,15,37,.12);
  --accent:#e2337a; --accent-ink:#fff; --berry:#a3195b; --lilac:#9b5fd0;
  --ok:#1f9a66; --warn:#c77a08; --danger:#d42c4f;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:13px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1a0912;
    --blob-1:#c2185b; --blob-2:#ff6f91; --blob-3:#7b2a8f; --blob-4:#5a1238;
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --glass-border:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.30);
    --shadow:0 10px 40px rgba(0,0,0,.4);
    --fg:#ffeaf3; --fg-2:rgba(255,234,243,.74); --fg-3:rgba(255,234,243,.5); --line:rgba(255,234,243,.15);
    --accent:#ff6fa5; --accent-ink:#2a0716; --berry:#ffa6c9; --lilac:#d3a4ff;
    --ok:#62e3a4; --warn:#f4b740; --danger:#ff6b85;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1a0912;
  --blob-1:#c2185b; --blob-2:#ff6f91; --blob-3:#7b2a8f; --blob-4:#5a1238;
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --glass-border:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.30);
  --shadow:0 10px 40px rgba(0,0,0,.4);
  --fg:#ffeaf3; --fg-2:rgba(255,234,243,.74); --fg-3:rgba(255,234,243,.5); --line:rgba(255,234,243,.15);
  --accent:#ff6fa5; --accent-ink:#2a0716; --berry:#ffa6c9; --lilac:#d3a4ff;
  --ok:#62e3a4; --warn:#f4b740; --danger:#ff6b85;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--berry)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;will-change:transform}
.b1{width:52vmax;height:52vmax;background:var(--blob-1);top:-18vmax;left:-14vmax;animation:d1 28s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;background:var(--blob-2);bottom:-16vmax;right:-10vmax;animation:d2 34s ease-in-out infinite alternate}
.b3{width:30vmax;height:30vmax;background:var(--blob-3);top:28%;right:14%;opacity:.4;animation:d3 40s ease-in-out infinite alternate}
.b4{width:36vmax;height:36vmax;background:var(--blob-4);bottom:8%;left:18%;opacity:.5;animation:d1 46s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes d2{to{transform:translate(-7vmax,-5vmax) scale(1.12)}}
@keyframes d3{to{transform:translate(-10vmax,8vmax) scale(.9)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none}}

.glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%)}
.glass-2{background:var(--glass-2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-2)}}

.app{position:relative;z-index:1;display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) max(8px,calc(env(safe-area-inset-bottom,0px) - 14px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar nav{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px;border-radius:32px;max-width:560px;margin:0 auto;pointer-events:auto;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--tab-on:var(--accent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--glass-hi) 36%,transparent),color-mix(in srgb,var(--glass-hi) 13%,transparent) 55%,color-mix(in srgb,var(--glass-hi) 24%,transparent));border:1px solid color-mix(in srgb,var(--glass-hi) 62%,transparent);
  box-shadow:0 14px 38px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.10),inset 0 1.5px 0 color-mix(in srgb,var(--glass-hi) 95%,transparent),inset 0 -1px 0 color-mix(in srgb,var(--glass-hi) 35%,transparent);
  backdrop-filter:blur(22px) saturate(210%) brightness(1.06);-webkit-backdrop-filter:blur(22px) saturate(210%) brightness(1.06)}
.tabbar .tab{position:relative;z-index:1;color:var(--fg-2);padding:8px 2px;transition:color .2s,transform .2s}
.tabbar .tab[aria-current="page"]{background:transparent;box-shadow:none;color:var(--tab-on)}
.tabbar nav.dragging .tab[aria-current="page"]{color:var(--fg-2)}
.tabbar nav.dragging .tab.hot{color:var(--tab-on);transform:scale(1.08)}
.bubble{position:absolute;top:6px;bottom:6px;left:0;width:56px;border-radius:26px;pointer-events:none;will-change:transform;
  background:linear-gradient(180deg,color-mix(in srgb,var(--glass-hi) 92%,transparent),color-mix(in srgb,var(--glass-hi) 50%,transparent) 60%,color-mix(in srgb,var(--glass-hi) 72%,transparent));border:1px solid color-mix(in srgb,var(--glass-hi) 95%,transparent);
  box-shadow:inset 0 1.5px 0 var(--glass-hi),inset 0 -6px 10px color-mix(in srgb,var(--accent) 16%,transparent),0 6px 16px rgba(0,0,0,.22);
  backdrop-filter:blur(6px) saturate(220%) brightness(1.12);-webkit-backdrop-filter:blur(6px) saturate(220%) brightness(1.12);
  transition:transform .5s cubic-bezier(.25,1.45,.45,1),scale .25s ease,width .2s}
.bubble.drag{transition:scale .2s ease;scale:1.12 1.2;box-shadow:inset 0 1.5px 0 var(--glass-hi),inset 0 -6px 12px color-mix(in srgb,var(--accent) 22%,transparent),0 12px 26px rgba(0,0,0,.30)}
.bubble.noanim{transition:none}
@media (prefers-reduced-motion:reduce){.bubble{transition:none}}
.tab{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:19px;color:var(--fg-3);font-size:10.5px;font-weight:650;cursor:pointer;transition:background .2s,color .2s;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--glass-hi)}
@media (min-width:920px){
  .app{grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 0 18px max(18px,env(safe-area-inset-left,0px))}
  .side .glass{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 14px;color:var(--fg-2)}
  .side .tab[aria-current="page"]{color:var(--accent)}
  .tabbar{display:none}
  main{padding-block:24px 40px;padding-left:24px}
}
.brand{display:grid;gap:4px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.05}
.sync{margin-top:auto;font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:center;padding:8px 6px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.syncm{font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:center;justify-content:center}
@media (min-width:920px){.syncm{display:none}}

.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,42px);letter-spacing:-.03em;line-height:1.02}
h2{font-family:var(--f-display);font-weight:750;font-size:20px;letter-spacing:-.015em;line-height:1.15}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.card{padding:18px;display:grid;gap:12px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pagehead{display:grid;gap:6px;padding:4px 2px}
.subnav,.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--glass-border);background:var(--glass);padding:7px 13px;border-radius:99px;font-size:13px;font-weight:650;color:var(--fg-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:650;background:var(--glass-2);border:1px solid var(--glass-border)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--berry);white-space:nowrap}
.tag.g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.l{background:color-mix(in srgb,var(--lilac) 18%,transparent);color:var(--lilac)}

.hero{padding:22px;display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media (min-width:640px){.hero{grid-template-columns:1fr auto}}
.hero .quote{font-size:16px;color:var(--fg-2);max-width:52ch}
.ring{position:relative;width:132px;height:132px;justify-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line);stroke-width:11}
.ring .pr{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .in b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em}
.ring .in span{font-size:11.5px;color:var(--fg-2);font-weight:600}
.bday{padding:16px 18px;display:grid;gap:4px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--lilac) 28%,transparent))}

.stat{padding:16px 18px;display:grid;gap:4px;min-width:0;align-content:start}
.stat .v{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .v small{font-size:14px;color:var(--fg-3);font-weight:500;font-family:var(--f-body)}
.stat .s{font-size:12.5px;color:var(--fg-2)}

.btn{appearance:none;border:0;padding:11px 18px;border-radius:15px;font-weight:750;font-size:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.ghost{background:var(--glass-2);color:var(--fg);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn[data-armed="1"]{background:var(--danger);color:#fff}
.big{appearance:none;text-align:left;cursor:pointer;padding:16px 18px;display:grid;gap:4px;color:var(--fg);transition:transform .15s}
.big:hover{transform:translateY(-2px)}
.big b{font-family:var(--f-display);font-size:18px;font-weight:750}
.big .ic{width:38px;height:38px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:4px}
.big .ic svg{width:21px;height:21px}

.field-l{display:grid;gap:5px;font-size:12.5px;font-weight:650;color:var(--fg-2);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;padding:11px 13px;border-radius:13px;border:1px solid var(--glass-border);background:var(--glass);font-size:15px;color:var(--fg)}
textarea{min-height:70px;resize:vertical}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.seg5{display:flex;gap:6px}
.seg5 button{appearance:none;flex:1;padding:9px 0;border-radius:11px;border:1px solid var(--glass-border);background:var(--glass);font-weight:700;cursor:pointer;color:var(--fg-2)}
.seg5 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* séance en cours */
.exo{padding:16px;display:grid;gap:10px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) auto minmax(0,1fr) 42px;gap:8px;align-items:center}
.set .n{font-weight:700;color:var(--fg-3);text-align:center}
.set input{padding:9px 10px;text-align:center;font-weight:700}
.set.done input{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.okb{appearance:none;width:42px;height:40px;border-radius:13px;border:1.5px solid var(--fg-3);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:800;font-size:16px}
.set.done .okb{background:var(--ok);border-color:var(--ok);color:#fff}
.sethead{display:grid;grid-template-columns:26px minmax(0,1fr) auto minmax(0,1fr) 42px;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);text-align:center}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 12px 10px 18px;border-radius:99px;display:flex;gap:10px;align-items:center;font-weight:700;max-width:calc(100% - 24px)}
.timer b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;min-width:58px}
@media (min-width:920px){.timer{bottom:24px}}

.entries{display:grid;gap:10px}
.entry{padding:14px 16px;border-radius:var(--r-md);background:var(--glass);border:1px solid var(--glass-border);display:grid;gap:6px;min-width:0}
.entry .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:18px;border-radius:var(--r-md);border:1px dashed var(--line);color:var(--fg-2);font-size:14px;text-align:center}
.note{padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:13.5px;color:var(--fg-2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
td.r,th.r{text-align:right}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-3);font-family:var(--f-body);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .act{stroke:var(--accent);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.13}
.chart .pt{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.chart .last{fill:var(--accent)}
.chart .lbl{fill:var(--fg);font-weight:700;font-size:13px}

/* recettes */
.rec{appearance:none;text-align:left;cursor:pointer;padding:16px;display:grid;gap:8px;color:var(--fg);align-content:start;transition:transform .15s}
.rec:hover{transform:translateY(-2px)}
.rec b{font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.2}
.rec .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--fg-2)}
.heart{color:var(--accent)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--fg-2)}
.steps li::marker{color:var(--accent);font-weight:800}
.ing{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.ing li span:last-child{color:var(--fg-2);text-align:right}
.check{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:11px 14px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--glass-border);cursor:pointer;text-align:left;width:100%;appearance:none}
.box{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--fg-3);display:grid;place-items:center;margin-top:1px;flex:none}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--fg-3)}
.lbl{font-weight:650;font-size:14.5px}
.det{display:block;font-size:13px;color:var(--fg-2)}

/* eau, semaine, calendrier, badges */
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:26px;height:32px;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;border:1.5px solid var(--line);background:transparent}
.drop.on{background:linear-gradient(180deg,#8fd3ff,#4aa8f0);border-color:#4aa8f0}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.wk7 .c{display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font-size:11px;color:var(--fg-3)}
.wk7 .bar{width:100%;max-width:30px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--lilac),var(--accent));min-height:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;font-weight:700;color:var(--fg-3);text-align:center}

const DEF={main:{goal:3,rest:90,progs:[],cex:[],favs:{},week:{},shop:{},cycle:{on:false,starts:[],len:28}},daily:{d:{}}};
const S={db:null,base:null,mode:'connecting',synced:false,slow:false,state:{main:clone(DEF.main),daily:clone(DEF.daily),log:[]},queues:{},seen:{}};
const LKEY='studio-laura-v1',DKEY='studio-laura-draft';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY)||'null');if(d){if(d.main)S.state.main=merge('main',d.main);if(d.daily)S.state.daily=merge('daily',d.daily);if(Array.isArray(d.log))S.state.log=d.log;S.hadLocal=true;}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S.state))}catch(e){}GSync.touch();}
function merge(k,d){const b=clone(DEF[k]);for(const [kk,vv] of Object.entries(d||{}))b[kk]=vv;if(k==='main')b.cycle=Object.assign(clone(DEF.main.cycle),b.cycle||{});return b;}
function sortLog(){normLog();S.state.log.sort((a,b)=>(b.date+(b.ts||''))>(a.date+(a.ts||''))?1:-1);}
function dbFail(e){if(e&&e.code==='invalid_argument'){S.mode='local';renderNav();}else toast("Sauvegarde en ligne impossible pour l'instant. Tes données restent sur cet appareil.");}
function save(k){
  saveLocal();if(S.mode!=='db')return;
  const q=S.queues[k]||(S.queues[k]={busy:false,next:null});q.next=clone(S.state[k]);if(!q.busy)flush(k);
}
async function flush(k){
  const q=S.queues[k];q.busy=true;
  while(q.next&&S.mode==='db'){const d=q.next;q.next=null;try{await S.db.doc(S.base+'/'+k).set(d);}catch(e){dbFail(e);}}
  q.busy=false;
}
const busy=k=>{const q=S.queues[k];return q&&(q.busy||q.next);};
const logCol=()=>S.db.doc(S.base+'/main').collection('log');
async function putLog(id,data){saveLocal();if(S.mode!=='db')return;try{await logCol().doc(id).set(data);}catch(e){dbFail(e);}}
async function delLog(id){saveLocal();if(S.mode!=='db')return;try{await logCol().doc(id).delete();}catch(e){dbFail(e);}}
function addLog(e){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);e.ts=new Date().toISOString();S.state.log.unshift(Object.assign({id},e));sortLog();putLog(id,e);}
async function initStore(){
  loadLocal();sortLog();renderAll();
  let db=null,uid=null;
  try{if(window.claude&&typeof window.claude.use==='function'){const user=await window.claude.use('user');db=await window.claude.use('db');uid=user?await user.id():null;}}catch(e){db=null;}
  if(!db||!uid){S.mode='local';GSync.load();renderAll();maybeSeed();GSync.start();return;}
  S.db=db;S.base='data/users/'+uid;S.mode='db';renderNav();
  const timer=setTimeout(()=>{if(!S.synced){S.slow=true;renderNav();}},10000);
  const onErr=()=>{clearTimeout(timer);S.mode='local';renderNav();maybeSeed();};
  const ok=snap=>{if(snap.metadata&&!snap.metadata.fromCache&&!S.synced){S.synced=true;S.slow=false;clearTimeout(timer);renderNav();}};
  for(const k of ['main','daily']){
    db.doc(S.base+'/'+k).onSnapshot(snap=>{
      ok(snap);if(busy(k))return;
      if(snap.exists){S.state[k]=merge(k,clone(snap.data()));saveLocal();schedule();}
      else if(!snap.metadata.fromCache&&!S.seen[k]&&S.hadLocal)save(k);
      if(!snap.metadata.fromCache){S.seen[k]=true;maybeSeed();}
    },onErr);
  }
  logCol().onSnapshot(qs=>{
    ok(qs);
    if(qs.empty&&!qs.metadata.fromCache&&!S.seen.log&&S.state.log.length){S.seen.log=true;S.state.log.slice(0,300).forEach(e=>{const d=clone(e);delete d.id;putLog(e.id,d);});maybeSeed();return;}
    if(!qs.metadata.fromCache)S.seen.log=true;
    if(qs.empty&&qs.metadata.fromCache)return;
    S.state.log=qs.docs.map(d=>Object.assign({id:d.id},d.data()));sortLog();saveLocal();schedule();maybeSeed();
  },onErr);
}

/* ---------- synchronisation entre appareils (site web) ---------- */
const SKEY='sport-laura-sync-code',MKEY='sport-laura-sync-meta';
function mergeStates(r,l,remoteFirst){
  // r = version en ligne, l = cet appareil. Les séances sont réunies ; pour les réglages, la version prioritaire l'emporte.
  const o=clone(l),A=remoteFirst?l:r,B=remoteFirst?r:l;
  o.main=merge('main',Object.assign({},A.main||{},B.main||{}));
  o.main.imp=Object.assign({},(r.main||{}).imp||{},(l.main||{}).imp||{});
  o.daily={d:Object.assign({},(A.daily||{}).d||{},(B.daily||{}).d||{})};
  const m=new Map();(r.log||[]).forEach(x=>m.set(x.id,x));(l.log||[]).forEach(x=>m.set(x.id,x));
  o.log=[...m.values()];
  return o;
}
const GSync={code:'',meta:{base:0,dirty:false},st:'off',timer:null,busy:false,again:false,applying:false,
  load(){try{this.code=localStorage.getItem(SKEY)||'';this.meta=JSON.parse(localStorage.getItem(MKEY)||'null')||{base:0,dirty:false};}catch(e){}},
  saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(this.meta))}catch(e){}},
  label(){
    if(!this.code)return['warn','Sauvegarde sur cet appareil uniquement'];
    return{sync:['','Synchronisation…'],ok:['ok','Synchronisé entre tes appareils'],err:['warn','Hors ligne : synchronisation en attente'],nocfg:['warn','Synchronisation pas encore configurée sur Vercel'],off:['','Synchronisation…']}[this.st];
  },
  set(st){this.st=st;renderNav();if(VIEW==='bilan'&&!editing())renderView();},
  touch(){
    if(this.applying)return;
    this.meta.dirty=true;this.saveMeta();
    if(!this.code)return;
    if(this.busy){this.again=true;return;}
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.sync(),1500);
  },
  async call(method,body){
    const r=await fetch('/api/sync',{method,cache:'no-store',headers:{'content-type':'application/json','x-sync-code':this.code},body:body?JSON.stringify(body):undefined});
    if(r.status===503)throw{nocfg:true};
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  },
  apply(state){
    this.applying=true;
    if(state.main)S.state.main=merge('main',state.main);
    if(state.daily)S.state.daily=merge('daily',state.daily);
    if(Array.isArray(state.log))S.state.log=state.log;
    sortLog();
    try{localStorage.setItem(LKEY,JSON.stringify(S.state))}catch(e){}
    this.applying=false;schedule();
  },
  async sync(){
    if(!this.code||S.mode!=='local')return;
    if(this.busy){this.again=true;return;}
    this.busy=true;this.again=false;if(this.st!=='ok')this.set('sync');
    try{
      const remote=await this.call('GET');
      if(remote&&remote.t>this.meta.base&&remote.state){
        this.apply(this.meta.dirty?mergeStates(remote.state,S.state,!!this.meta.fresh):remote.state);
        this.meta.base=remote.t;
      }
      if(this.meta.dirty){
        const snap=JSON.stringify(S.state);
        const res=await this.call('POST',{t:Date.now(),state:JSON.parse(snap)});
        this.meta.base=res.t;this.meta.dirty=JSON.stringify(S.state)!==snap;
      }
      this.meta.fresh=false;this.saveMeta();this.set('ok');
    }catch(e){this.set(e&&e.nocfg?'nocfg':'err');}
    this.busy=false;
    if(this.again||this.meta.dirty){clearTimeout(this.timer);this.timer=setTimeout(()=>this.sync(),this.st==='ok'?800:15000);}
  },
  setCode(code){
    if(code&&code.length<8){toast('Le code doit faire au moins 8 caractères.');return;}
    this.code=code;
    try{if(code)localStorage.setItem(SKEY,code);else localStorage.removeItem(SKEY);}catch(e){}
    if(code){
      const s=S.state,pristine=!s.log.length&&!Object.keys(s.daily.d||{}).length&&!(s.main.progs||[]).length;
      this.meta={base:0,dirty:!pristine,fresh:true};this.saveMeta();this.st='sync';this.sync();
    }else{this.st='off';clearTimeout(this.timer);}
    renderAll();
  },
  start(){
    this.load();if(this.code)this.sync();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.sync();});
    setInterval(()=>{if(document.visibilityState==='visible')this.sync();},60000);
  }
};

function schedule(){if(PENDING)return;PENDING=true;requestAnimationFrame(()=>{PENDING=false;if(editing()){S.dirty=true;return;}renderAll();});}

/* barre du bas : une bulle de verre qui suit le doigt et se pose sur l'onglet le plus proche */
const BUB={drag:false,x:0};
function tabEls(){return[...$('#tabnav').querySelectorAll('.tab')];}
function curTab(){return Math.max(0,TABS.findIndex(t=>t[0]===VIEW));}
function placeBubble(i,instant){
  const nav=$('#tabnav'),b=nav.querySelector('.bubble'),t=tabEls()[i];if(!b||!t||!t.offsetWidth)return;
  if(instant)b.classList.add('noanim');
  b.style.width=t.offsetWidth+'px';b.style.transform='translateX('+t.offsetLeft+'px)';BUB.x=t.offsetLeft;
  if(instant){void b.offsetWidth;b.classList.remove('noanim');}
}
function renderTabbar(){
  const nav=$('#tabnav'),cur=curTab();
  if(!nav.dataset.built){
    nav.innerHTML='<span class="bubble" aria-hidden="true"></span>'+TABS.map(([id,l,ic])=>`<button class="tab" type="button" data-nav="${id}">${ICON[ic]}<span>${l}</span></button>`).join('');
    nav.dataset.built='1';initBubble(nav);placeBubble(cur,true);
  }
  tabEls().forEach((el,i)=>{if(i===cur)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
  if(!BUB.drag)placeBubble(cur);
}
function initBubble(nav){
  const b=nav.querySelector('.bubble');
  const nearest=()=>{const els=tabEls(),c=BUB.x+b.offsetWidth/2;let best=0,d=1e9;els.forEach((el,i)=>{const dd=Math.abs(el.offsetLeft+el.offsetWidth/2-c);if(dd<d){d=dd;best=i;}});return best;};
  const move=e=>{const els=tabEls(),r=nav.getBoundingClientRect(),lo=els[0].offsetLeft,hi=els[els.length-1].offsetLeft;
    BUB.x=Math.max(lo,Math.min(hi,e.clientX-r.left-b.offsetWidth/2));b.style.transform='translateX('+BUB.x+'px)';
    const h=nearest();els.forEach((el,i)=>el.classList.toggle('hot',i===h));};
  const end=commit=>{if(!BUB.drag)return;BUB.drag=false;b.classList.remove('drag');nav.classList.remove('dragging');
    const i=nearest();tabEls().forEach(el=>el.classList.remove('hot'));
    if(commit&&TABS[i][0]!==VIEW)go(TABS[i][0]);else placeBubble(curTab());};
  nav.addEventListener('pointerdown',e=>{if(e.button)return;BUB.drag=true;try{nav.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('drag');nav.classList.add('dragging');move(e);});
  nav.addEventListener('pointermove',e=>{if(BUB.drag)move(e);});
  nav.addEventListener('pointerup',()=>end(true));
  nav.addEventListener('pointercancel',()=>end(false));
  nav.addEventListener('click',e=>{const el=e.target.closest('[data-nav]');if(el&&e.detail===0)go(el.dataset.nav);});
  window.addEventListener('resize',()=>{if(!BUB.drag)placeBubble(curTab(),true);});
}

const M=()=>S.state.main;
const logOf=k=>S.state.log.filter(e=>e.kind===k);
const dayOf=d=>S.state.daily.d[d]||{};
function setDay(d,patch){const cur=Object.assign({},dayOf(d),patch);for(const k of Object.keys(cur))if(cur[k]==null||cur[k]==='')delete cur[k];S.state.daily.d[d]=cur;save('daily');}
const exName=id=>{const e=EX.find(x=>x[0]===id)||(M().cex||[]).map(c=>[c.id,c.n]).find(x=>x[0]===id);return e?e[1]:id;};
const progs=()=>PRESETS.concat(M().progs||[]);
const metric=ex=>{const kgs=ex.sets.map(s=>Number(s.kg)||0),mk=Math.max(0,...kgs);return mk>0?{v:mk,u:'kg'}:{v:Math.max(0,...ex.sets.map(s=>Number(s.r)||0)),u:UNIT[ex.id]||'rép.'};};
const setTxt=(id,s)=>s.l?s.l+' ×'+s.r:s.r+(Number(s.kg)?' × '+fr(Number(s.kg))+' kg':' '+(UNIT[id]||'rép.'));
const targetFor=id=>{const last=lastFor(id);if(!last)return null;const mk=Math.max(0,...last.map(s=>Number(s.kg)||0));if(!mk)return null;const inc=HALT.has(id)?1:2;return{kg:mk+inc,inc,halt:HALT.has(id)};};
function maybeSeed(){
  if(S.mode==='connecting'||(S.mode==='db'&&!(S.seen.main&&S.seen.log)))return;
  const m=M();m.imp=m.imp||{};let ch=false;
  for(const sd of SEEDS){if(m.imp[sd.id])continue;m.imp[sd.id]=1;ch=true;if(!S.state.log.some(e=>e.id===sd.id)){S.state.log.push(Object.assign({id:sd.id},clone(sd.e)));sortLog();putLog(sd.id,clone(sd.e));}}
  if(ch){save('main');schedule();}
}
function exHistory(id){return logOf('muscu').slice().reverse().map(e=>{const x=(e.ex||[]).find(y=>y.id===id);return x?Object.assign({date:e.date},metric(x)):null;}).filter(Boolean);}
function records(){const best={},list=[];for(const e of logOf('muscu').slice().reverse())for(const x of e.ex||[]){const m=metric(x),b=best[x.id];if(b&&b.u===m.u&&m.v>b.v)list.push({id:x.id,date:e.date,v:m.v,u:m.u,prev:b.v});if(!b||b.u!==m.u||m.v>b.v)best[x.id]={v:m.v,u:m.u,date:e.date};}return{best,list};}
const lastFor=id=>{for(const e of logOf('muscu')){const x=(e.ex||[]).find(y=>y.id===id);if(x)return x.sets;}return null;};
const active=e=>e.kind==='muscu'||e.kind==='pilates';
const weekCount=mon=>S.state.log.filter(e=>active(e)&&e.date>=mon&&e.date<=addDays(mon,6)).length;
function streaks(){const goal=M().goal||3,cur=monOf(todayISO());if(!S.state.log.length)return{now:0,best:0};
  let first=monOf(S.state.log[S.state.log.length-1].date),run=0,best=0;if(diffDays(first,cur)>7*520)first=addDays(cur,-7*520);
  for(let w=first;w<=cur;w=addDays(w,7)){if(weekCount(w)>=goal){run++;best=Math.max(best,run);}else if(w!==cur)run=0;}
  return{now:run,best};}
function cycleInfo(){const c=M().cycle;if(!c.on||!c.starts.length)return null;const st=c.starts.slice().sort();let len=c.len||28;
  if(st.length>1){const ds=[];for(let i=1;i<st.length;i++){const d=diffDays(st[i-1],st[i]);if(d>=20&&d<=40)ds.push(d);}if(ds.length)len=Math.round(ds.reduce((a,b)=>a+b,0)/ds.length);}
  const last=st[st.length-1],n=diffDays(last,todayISO());if(n<0)return null;const day=(n%len)+1,ov=len-14;
  let ph,ad;
  if(day<=5){ph='Règles';ad="Écoute-toi. Pilates doux, marche ou étirements. Si tu as de l'énergie, une séance légère fait souvent du bien.";}
  else if(day<ov-1){ph='Phase folliculaire';ad="L'énergie remonte. C'est le bon moment pour charger en muscu et tenter un record.";}
  else if(day<=ov+1){ph='Ovulation';ad="Pic de forme possible. Profites-en, et soigne bien ton échauffement.";}
  else{ph='Phase lutéale';ad="Énergie plus variable. Garde le rythme, baisse un peu les charges si besoin, et mise sur le pilates et le sommeil en fin de phase.";}
  return{day,len,ph,ad,next:addDays(last,(Math.floor(n/len)+1)*len)};}
function badges(){const mu=logOf('muscu').length,pi=logOf('pilates').length,mo=logOf('mob').length,tot=mu+pi,rec=records().list.length,stk=streaks().best;

function lineChart(pts,unit){
  const W=640,H=230,pl=40,pr=22,pt=26,pb=30;const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi===lo){hi+=1;lo=Math.max(0,lo-1);}const padv=(hi-lo)*.15;lo=Math.max(0,lo-padv);hi+=padv;
  const X=i=>pts.length===1?(pl+W-pr)/2:pl+i/(pts.length-1)*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${fr(v)}</text>`;}
  const line=pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ');
  if(pts.length>1)g+=`<polygon class="area" points="${X(0)},${H-pb} ${line} ${X(pts.length-1)},${H-pb}"/><polyline class="act" points="${line}"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;g+=`<circle class="${last?'last':'pt'}" cx="${X(i)}" cy="${Y(p.v)}" r="${last?5.5:3.5}"/>`;});

  g+=`<text x="${X(0)}" y="${H-9}" text-anchor="${pts.length>1?'start':'middle'}">${dshort(pts[0].date)}</text>`;if(pts.length>1)g+=`<text x="${X(pts.length-1)}" y="${H-9}" text-anchor="end">${dshort(l.date)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progression">${g}</svg>`;
}

let AC=null;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.5);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.5);}catch(e){}}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const cols=['#e2337a','#ff9cc2','#9b5fd0','#ffc4a6','#ffffff'];
  const ps=Array.from({length:90},()=>({x:c.width/2+(Math.random()-.5)*120,y:c.height*.45,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1700;x.clearRect(0,0,c.width,c.height);if(k>=1){c.hidden=true;return;}
    for(const p of ps){p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.globalAlpha=1-k;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();}
    requestAnimationFrame(f);})(t0);
}

},1000);

  if(a==='setadd'){const x=A.ex[el.dataset.i],l=x.sets[x.sets.length-1];x.sets.push({r:l?l.r:12,kg:l?l.kg:'',ok:false});saveDraft();renderView();return;}
  if(a==='setdel'){A.ex[el.dataset.i].sets.pop();saveDraft();renderView();return;}
  if(a==='exdel'){if(!armed(el))return;A.ex.splice(Number(el.dataset.i),1);saveDraft();renderView();return;}
  if(a==='exadd'){let id=$('#addEx').value;const nw=$('#addExNew').value.trim();
    if(nw){id='c_'+nw.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'_').slice(0,40);m.cex=m.cex||[];if(!m.cex.some(c=>c.id===id)&&!EX.some(x=>x[0]===id)){m.cex.push({id,n:nw});save('main');}}
    if(!id){toast('Choisis un exercice dans la liste ou écris son nom.');return;}
    if(A.ex.some(x=>x.id===id)){toast('Cet exercice est déjà dans ta séance.');return;}
    A.ex.push(mkEx(id));saveDraft();renderView();return;}
  if(a==='mfinish'){finishMuscu();return;}
  if(a==='mcancel'){if(!armed(el,'Confirmer l\'abandon'))return;A=null;REST=null;saveDraft();renderTimer();renderView();return;}
  if(a==='restadd'){if(REST){REST.left+=15;renderTimer();}return;}
  if(a==='restskip'){REST=null;renderTimer();return;}
  if(a==='npnew'){NP={n:'',ex:[]};renderView();return;}
  if(a==='npcancel'){NP=null;renderView();return;}
  if(a==='nptog'){NP.n=$('#npName').value;const i=NP.ex.indexOf(el.dataset.id);if(i>=0)NP.ex.splice(i,1);else NP.ex.push(el.dataset.id);el.setAttribute('aria-pressed',String(i<0));return;}
  if(a==='npsave'){const n=$('#npName').value.trim();if(!n||!NP.ex.length){toast('Donne un nom et choisis au moins un exercice.');return;}m.progs=m.progs||[];m.progs.push({id:'u'+Date.now().toString(36),n,ex:NP.ex});NP=null;save('main');renderView();toast('Programme enregistré');return;}
  if(a==='delprog'){if(!armed(el))return;m.progs=(m.progs||[]).filter(p=>p.id!==el.dataset.id);save('main');renderView();return;}
  if(a==='dellog'){if(!armed(el))return;const id=el.dataset.id;S.state.log=S.state.log.filter(x=>x.id!==id);delLog(id);renderView();toast('Supprimé');return;}
  /* pilates, étirements */
  if(a==='pfeel'){PFEEL=Number(el.dataset.v);el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));return;}
  if(a==='pex'){SHEET={t:'pex',id:el.dataset.id};renderSheet();return;}
  if(a==='play'){const kind=el.dataset.k,r=(kind==='pilates'?ROUTINES:MOBS).find(x=>x.id===el.dataset.id),steps=stepsOf(kind,r);PL={kind,r,steps,i:0,left:steps[0].s,run:true};SHEET={t:'player'};renderSheet();return;}
  if(a==='plpause'){PL.run=!PL.run;renderSheet();return;}
  if(a==='plprev'){if(PL.i>0){PL.i--;PL.left=PL.steps[PL.i].s;renderSheet();}return;}
  if(a==='plnext'){plNext();return;}
  /* nutrition */
  if(a==='rcat'){RCAT=el.dataset.c;renderView();return;}
  if(a==='recipe'){SHEET={t:'recipe',id:el.dataset.id};renderSheet();return;}
  if(a==='fav'){m.favs=m.favs||{};if(m.favs[el.dataset.id])delete m.favs[el.dataset.id];else m.favs[el.dataset.id]=1;save('main');renderAll();return;}
  if(a==='weektog'){m.week=m.week||{};const on=!m.week[el.dataset.id];if(on)m.week[el.dataset.id]=1;else delete m.week[el.dataset.id];save('main');renderAll();toast(on?'Ajouté à ta liste de courses':'Retiré de ta liste');return;}
  if(a==='shop'){m.shop=m.shop||{};const it=el.dataset.it;if(m.shop[it])delete m.shop[it];else m.shop[it]=1;save('main');renderView();return;}
  if(a==='shopclear'){if(!armed(el))return;m.week={};m.shop={};save('main');renderView();return;}
  /* cycle, bilan */
  if(a==='cyon'){m.cycle.on=true;save('main');renderView();return;}
  if(a==='cyoff'){if(!armed(el,'Confirmer : tout effacer'))return;m.cycle={on:false,starts:[],len:28};save('main');renderView();return;}
  if(a==='cydel'){m.cycle.starts=m.cycle.starts.filter(d=>d!==el.dataset.d);save('main');renderView();return;}
  if(a==='month'){const [y,mo]=MONTH.split('-').map(Number),d=new Date(y,mo-1+Number(el.dataset.v),1);MONTH=d.getFullYear()+'-'+pad(d.getMonth()+1);renderView();return;}
});
document.addEventListener('input',e=>{const el=e.target;if(A&&el.dataset&&el.dataset.f){A.ex[el.dataset.i].sets[el.dataset.j][el.dataset.f]=el.value;saveDraft();}});
document.addEventListener('change',e=>{
  if(A&&e.target.id==='mDate'){const v=e.target.value;A.date=v&&v<=todayISO()?v:null;saveDraft();if(v&&v>todayISO()){toast('Choisis une date passée ou aujourd\'hui.');e.target.value=todayISO();}}
  if(A&&e.target.id==='mMin'){const v=Math.round(num(e.target.value));A.min=v>=1&&v<=300?v:null;saveDraft();}
  if(e.target.id==='progEx'){PEXSEL=e.target.value;e.target.blur();renderView();}
  if(e.target.id==='sleepIn'){const v=num(e.target.value);setDay(todayISO(),{s:v>0&&v<=14?v:null});}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='syncForm'){const i=$('#syncCode');if(i){i.blur();GSync.setCode(i.value.trim());}return;}
  if(f.id==='pilForm'){addLog({kind:'pilates',date:$('#pd').value||todayISO(),type:$('#pt').value,min:Number($('#pm').value)||0,feel:PFEEL,note:$('#pn').value.trim()});if(document.activeElement)document.activeElement.blur();renderView();toast('Séance de pilates enregistrée');return;}
  if(f.id==='cyForm'){const d=$('#cyd').value;if(!d||d>todayISO()){toast('Choisis une date passée ou aujourd\'hui.');return;}const c=M().cycle;if(!c.starts.includes(d))c.starts.push(d);save('main');if(document.activeElement)document.activeElement.blur();renderView();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet();});
function fromHash(){const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))VIEW=h;}
window.addEventListener('hashchange',()=>{fromHash();renderAll();});
fromHash();
initStore();
})();
</script>
</body></html>
